name: Bug report
description: Report reproducible incorrect behavior
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, authorization headers, or private payloads.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps with all sensitive values replaced.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or image tag
      placeholder: main, v1.0.0, or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, operating system, and Docker version if applicable.
